<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Collection – Aurum</title>
<meta name="description" content="Aurum – fine mechanical watches. Explore the collection and book a private viewing at our Pune boutique.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0d12'/%3E%3Ctext x='16' y='23' font-family='Georgia' font-size='20' fill='%23c8a45d' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="collection">
<header id="site-header" class="site-header"></header>
<main>
<section class="page-head">
  <div class="container">
    <p class="eyebrow">The Collection</p>
    <h1>All watches</h1>
    <p class="lead">Every watch is assembled and tested by one watchmaker. Prices are in Indian rupees and include all taxes.</p>
  </div>
</section>
<section class="section section-tight">
  <div class="container">
    <form class="filters" id="filters" role="search">
      <div class="field"><label for="fSearch">Search</label><input id="fSearch" type="search" placeholder="Name, movement or material"></div>
      <div class="field"><label for="fCollection">Collection</label><select id="fCollection"><option value="">All collections</option></select></div>
      <div class="field"><label for="fStock">Availability</label><select id="fStock"><option value="">All</option><option value="in">In stock</option><option value="order">Made to order</option></select></div>
      <div class="field"><label for="fSort">Sort by</label><select id="fSort"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="name">Name</option></select></div>
      <button type="button" class="btn btn-outline" id="fClear">Clear</button>
    </form>
    <p class="muted small" id="resultCount"></p>
    <div class="watch-grid" id="watchList"></div>
  </div>
</section>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/collection.js"></script>
</body>
</html>
